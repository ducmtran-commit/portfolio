  <main id="top">

        <div class="film-lab film-lab--centered-head" id="film-lab" aria-label="Film roll portfolio viewer">

          <div class="film-lab__root">
            <div class="film-shelf-panel" id="film-shelf-panel">

              <div class="film-viewer">

                  <div class="film-viewer__meta">

                      <a

                        id="film-viewer-project-link"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                        hidden
                      ></a>
                    </p>
                  </div>
                  <div class="film-viewer__swap">
                    <label class="visually-hidden" for="film-roll-swap">Load a different roll</label>
                    <select class="film-viewer__select" id="film-roll-swap"></select>
                  </div>
                </div>

                <div class="film-viewer__bench">
                  <div class="film-unspool">
                    <div class="film-unspool__track">
                      <div class="film-strip-shell" id="film-strip-shell">
                        <div class="film-strip-wrap">
                          <div class="film-strip" id="film-strip" tabindex="0" aria-label="Film frames, scroll horizontally"></div>
                        </div>
                      </div>
                      <div class="film-spool" aria-hidden="true">

                        <span class="film-spool__knob"></span>
                        <span class="film-spool__body">

                          <span class="film-spool__slot"></span>
                        </span>

                    </div>

          </div>

            description:
              "Two/Worlds is a performance work that explores and represents isolation, longing, and fragile connections. In this piece, I portray a person who is trapped in a confined space, trying to escape the room and find a connection to the outside world. The character has already been living in this room, exercising and performing daily activities, yearning for escape but never truly going outside. The room functions as both shelter and prison, and the character never actually leaves it. The performance has two parts. The first part shows the character in his daily routine. He exercises, looks out the door to observe the outside world, tries to find a way to leave, and eventually gives up. This section focuses on expressing the feeling of being stuck, not only physically but also mentally and emotionally. The repetition of simple actions reflects how isolation can slowly drain motivation and hope. The video is intentionally sped up to two times the normal speed to create the impression that time is passing quickly and almost unnoticed. This effect suggests how days can blur together when someone is trapped in a limited space and repetitive cycle. The second part marks the turning point of the performance. This shift happens when the character notices a cat outside the room. The cat moves freely and appears curious and independent, full of life in contrast to the character’s restrained condition. The cat wants to come inside, while the character wants to go outside. This mirrored desire becomes the central idea of the work. They represent two parallel worlds separated by a transparent but impenetrable barrier. The barrier may be a door, a window, or simply an implied boundary, but it is never crossed. Eventually, the cat loses interest and walks away, the character loses the connection again, the cat finds a way to sit and enjoy his space, while the character feels empty. That moment is quiet but devastating. The character remains inside, still reaching, but the other world has moved on. The loss is subtle yet profound. The connection that once animated the space disappears, leaving me more aware of my confinement than before. Two/Worlds was inspired by my experience taking care of my cousin’s cat while she was on vacation. My cousin instructed me not to let the cat go outside, so I kept her inside the room. There was a large window, and she would usually sit there and look out. She slept there, cleaned herself there, and spent most of her time beside that window. Occasionally, the cat would meow at the door as if asking to go outside, but I could not let her out. During the time I spent with her, I began to wonder what it felt like for her to remain confined in that space. If she continued living this way, would she start to feel disconnected from the outside world? Was she content, or was she stressed? These questions stayed with me. I began imagining what would happen if a person experienced the same situation. What if being stuck in a room without the ability to leave affected someone more deeply than we assume? What if there is something more complex about confinement than simply being physically restricted? Because of this experience, I created this performance artwork. Rather than providing a clear answer, the work invites the audience to interpret it in their own way. I want viewers to decide what the experience means to them and what emotional response they take from it. Each person may see something different in the performance, depending on their own memories and feelings. Ultimately, to me, Two Worlds explores the thin boundaries between closeness and separation, freedom and confinement, and presence and absence. The door separate the two worlds, inside and outside, becomes the most meaningful element of the work. It represents both connection and restriction at the same time. Even the “/” in the title functions as a symbol of division. It visually separates the two worlds while still linking them within a single name, reflecting the tension between distance and relationship.",

    const shelfEl = document.getElementById("film-shelf");
    const shelfPanel = document.getElementById("film-shelf-panel");

    const viewerStats = document.getElementById("film-viewer-stats");
    const rollSwap = document.getElementById("film-roll-swap");
    const stripEl = document.getElementById("film-strip");
    const stripShell = document.getElementById("film-strip-shell");
    const scrubEl = document.getElementById("film-scrub-range");
    const viewerProjectLink = document.getElementById("film-viewer-project-link");

    let activeRollId = null;
    let scrubSyncLock = false;

    const filmLabRoot = shelfPanel.parentElement;

    function rollById(id) {
      return FILM_ROLLS.find((r) => r.id === id);
    }

    function buildShelf() {
      shelfEl.innerHTML = "";
      FILM_ROLLS.forEach((roll) => {
        const slot = document.createElement("div");
        slot.className = "film-roll-slot";
        slot.id = `film-roll-slot-${roll.id}`;
        slot.dataset.rollId = roll.id;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "film-roll";
        btn.id = `film-roll-${roll.id}`;
        btn.dataset.rollId = roll.id;
        btn.setAttribute("aria-label", `Load ${roll.name}, ${roll.frames.length} frames`);

        const mat = document.createElement("span");
        mat.className = "film-roll__mat";
        mat.setAttribute("aria-hidden", "true");

        const canWrap = document.createElement("span");
        canWrap.className = "film-roll__canister-wrap";

        const can = document.createElement("span");
        can.className = "film-roll__canister";

        const topStack = document.createElement("span");
        topStack.className = "film-roll__top-stack";

        const knob = document.createElement("span");
        knob.className = "film-roll__knob";

        const capTop = document.createElement("span");
        capTop.className = "film-roll__cap film-roll__cap--top";
        capTop.setAttribute("aria-hidden", "true");

        topStack.append(knob, capTop);

        const body = document.createElement("span");
        body.className = "film-roll__body";

        const slit = document.createElement("span");
        slit.className = "film-roll__slit";
        slit.setAttribute("aria-hidden", "true");

        const band = document.createElement("span");
        band.className = "film-roll__label-band";

        const exp = document.createElement("span");
        exp.className = "film-roll__exp";
        exp.textContent = `${roll.frames.length} exp.`;

        body.append(slit, band, exp);

        const capBottom = document.createElement("span");
        capBottom.className = "film-roll__cap film-roll__cap--bottom";
        capBottom.setAttribute("aria-hidden", "true");

        can.append(topStack, body, capBottom);

        const leader = document.createElement("span");
        leader.className = "film-roll__leader";
        const leaderInner = document.createElement("span");
        leaderInner.className = "film-roll__leader-inner";

        const perfTop = document.createElement("span");
        perfTop.className = "film-roll__leader-perfs film-roll__leader-perfs--top";
        perfTop.setAttribute("aria-hidden", "true");

        const leaderFrame = document.createElement("span");
        leaderFrame.className = "film-roll__leader-frame";

        const thumb = document.createElement("img");
        thumb.src = roll.frames[0].src;
        thumb.alt = "";
        thumb.decoding = "async";
        leaderFrame.appendChild(thumb);

        const perfBot = document.createElement("span");
        perfBot.className = "film-roll__leader-perfs film-roll__leader-perfs--bottom";
        perfBot.setAttribute("aria-hidden", "true");

        leaderInner.append(perfTop, leaderFrame, perfBot);
        leader.appendChild(leaderInner);

        canWrap.append(can, leader);

        const meta = document.createElement("span");
        meta.className = "film-roll__meta";
        const typeParts = roll.type.split("·").map((s) => s.trim());
        const kind = typeParts[0] || "";
        const detail = typeParts.slice(1).join(" · ");
        meta.innerHTML =
          `<span class="film-roll__name">${roll.name}</span>` +
          `<span class="film-roll__eyebrow">${kind}</span>` +
          `<span class="film-roll__stats">` +
          `<span class="film-roll__stat-strong">${roll.frames.length} frames</span>` +
          (detail
            ? `<span class="film-roll__stat-sep" aria-hidden="true">·</span><span class="film-roll__stat-detail">${detail}</span>`
            : "") +
          `</span>`;

        mat.appendChild(canWrap);
        btn.append(mat, meta);
        slot.appendChild(btn);
        shelfEl.appendChild(slot);
      });

      // Event delegation so opening keeps working after slot moves
      if (!shelfEl.dataset.openBound) {
        shelfEl.dataset.openBound = "1";
        shelfEl.addEventListener("click", (event) => {
          const btn = event.target.closest(".film-roll");
          if (!btn || btn.hidden || !shelfEl.contains(btn)) return;
          event.preventDefault();
          openViewer(btn.dataset.rollId);
        });
      }
    }

    function buildSwapOptions(selectedId) {
      rollSwap.innerHTML = "";
      FILM_ROLLS.forEach((roll) => {
        const opt = document.createElement("option");
        opt.value = roll.id;
        opt.textContent = `${roll.name} (${roll.frames.length})`;
        if (roll.id === selectedId) opt.selected = true;
        rollSwap.appendChild(opt);
      });
    }

    function renderStrip(roll) {
      stripEl.innerHTML = "";
      roll.frames.forEach((frame, i) => {
        const cell = document.createElement("div");
        cell.className = "film-cell";
        cell.dataset.index = String(i);

        const stock = document.createElement("div");
        stock.className = "film-cell__stock";

        const perfTop = document.createElement("div");
        perfTop.className = "film-cell__perfs film-cell__perfs--top";
        perfTop.setAttribute("aria-hidden", "true");

        const mid = document.createElement("div");
        mid.className = "film-cell__mid";

        const win = document.createElement("div");
        win.className = "film-cell__window";
        const im = document.createElement("img");
        im.src = frame.src;
        im.alt = frame.alt;
        im.loading = "lazy";
        im.decoding = "async";
        im.setAttribute("data-lightbox", "");
        im.setAttribute("data-caption", frame.caption);
        if (frame.description) im.setAttribute("data-description", frame.description);
        if (frame.videoEmbed) im.setAttribute("data-video-embed", frame.videoEmbed);
        if (frame.linkHref) im.setAttribute("data-link-href", frame.linkHref);
        if (frame.linkLabel) im.setAttribute("data-link-label", frame.linkLabel);
        win.appendChild(im);

        mid.appendChild(win);

        const perfBot = document.createElement("div");
        perfBot.className = "film-cell__perfs film-cell__perfs--bottom";
        perfBot.setAttribute("aria-hidden", "true");

        stock.append(perfTop, mid, perfBot);

        const cap = document.createElement("p");
        cap.className = "film-cell__caption";
        if (frame.linkHref) {
          const titleLink = document.createElement("a");
          titleLink.className = "film-cell__caption-link";
          titleLink.href = frame.linkHref;
          titleLink.target = "_blank";
          titleLink.rel = "noopener noreferrer";
          titleLink.textContent = frame.caption;
          titleLink.addEventListener("click", (event) => event.stopPropagation());
          cap.appendChild(titleLink);
        } else {
          cap.textContent = frame.caption;
        }

        cell.append(stock, cap);
        stripEl.appendChild(cell);
      });
    }

    function updateMeta(roll) {
      viewerType.textContent = roll.type;
      viewerTitle.textContent = roll.name;
      viewerStats.textContent = `${roll.frames.length} frame${roll.frames.length === 1 ? "" : "s"} on this roll`;
      if (roll.projectLink && roll.projectLink.href) {
        viewerProjectLink.href = roll.projectLink.href;
        viewerProjectLink.textContent = roll.projectLink.label || "Open project link";
        viewerProjectLink.hidden = false;
      } else {
        viewerProjectLink.href = "#";
        viewerProjectLink.textContent = "";
        viewerProjectLink.hidden = true;
      }

    }

    function syncScrubFromScroll() {
      const max = stripEl.scrollWidth - stripEl.clientWidth;
      scrubSyncLock = true;
      if (max <= 0) {
        scrubEl.value = "0";
        scrubEl.disabled = true;
        scrubEl.setAttribute("aria-valuetext", "Single frame");
      } else {
        scrubEl.disabled = false;
        const pct = Math.round((stripEl.scrollLeft / max) * 100);
        scrubEl.value = String(pct);
        scrubEl.setAttribute("aria-valuetext", `${pct}% along the strip`);
      }
      scrubSyncLock = false;
    }

    function syncScrollFromScrub() {
      const max = stripEl.scrollWidth - stripEl.clientWidth;
      if (max <= 0) return;
      const pct = Number(scrubEl.value) / 100;
      stripEl.scrollLeft = pct * max;
    }

    function bindStripScroll() {
      stripEl.addEventListener(
        "scroll",
        () => {
          if (scrubSyncLock) return;
          syncScrubFromScroll();
        },
        { passive: true }
      );
    }

    const UNSPOOL_MS = 820;
    const RETRACT_MS = 420;

    function loadRollInViewer(rollId) {
      const roll = rollById(rollId);
      if (!roll) return;
      activeRollId = rollId;
      updateMeta(roll);
      buildSwapOptions(rollId);
      renderStrip(roll);

      requestAnimationFrame(() => {
        stripEl.scrollLeft = 0;
        syncScrubFromScroll();
      });
    }

    function placeViewerAtRoll(rollId) {
      const slot = document.getElementById(`film-roll-slot-${rollId}`);
      const rollBtn = document.getElementById(`film-roll-${rollId}`);
      if (!slot || !rollBtn || !viewerPanel) return null;

      if (slotRollId && slotRollId !== rollId) {
        const prevSlot = document.getElementById(`film-roll-slot-${slotRollId}`);
        const prevBtn = document.getElementById(`film-roll-${slotRollId}`);
        if (prevSlot) prevSlot.classList.remove("film-roll-slot--open");
        if (prevBtn) {
          prevBtn.hidden = false;
          prevBtn.classList.remove("film-roll--stashed");
        }
      }

      slotRollId = rollId;
      // Hide the canister image here until the user returns to the shelf
      rollBtn.classList.add("film-roll--stashed");
      rollBtn.hidden = true;
      slot.classList.add("film-roll-slot--open");
      slot.appendChild(viewerPanel);
      shelfEl.classList.add("film-shelf--viewing");
      return rollBtn;
    }

    function returnViewerToHome() {
      const slot = slotRollId ? document.getElementById(`film-roll-slot-${slotRollId}`) : null;
      const rollBtn = slotRollId ? document.getElementById(`film-roll-${slotRollId}`) : null;
      if (slot) slot.classList.remove("film-roll-slot--open");
      if (rollBtn) {
        rollBtn.classList.remove("film-roll--stashed");
        rollBtn.hidden = false;
      }
      shelfEl.classList.remove("film-shelf--viewing");
      if (filmLabRoot) filmLabRoot.appendChild(viewerPanel);
      slotRollId = null;
      return rollBtn;
    }

    function openViewer(rollId) {
      const rollBtn = placeViewerAtRoll(rollId);
      if (!rollBtn) return;

      activeRollId = rollId;
      shelfPanel.classList.remove("film-shelf-panel--out");

      // Show the film in this slot immediately, then play the unspool effect
      viewerPanel.hidden = false;
      viewerPanel.removeAttribute("hidden");
      viewerPanel.classList.remove("film-viewer-panel--enter", "film-viewer-panel--swap");
      viewerPanel.classList.add("film-viewer-panel--visible");

      stripShell.classList.add("film-strip-shell--retracting");
      loadRollInViewer(rollId);
      void stripShell.offsetWidth;

      requestAnimationFrame(() => {
        stripShell.classList.remove("film-strip-shell--retracting");
        stripEl.classList.add("film-strip--reveal");
        window.setTimeout(() => stripEl.classList.remove("film-strip--reveal"), UNSPOOL_MS + 120);
        requestAnimationFrame(() => {
          syncScrubFromScroll();
          rollSwap.focus({ preventScroll: true });
        });
      });
    }

    function closeViewer() {
      if (viewerPanel.hidden && !slotRollId) return;
      stripShell.classList.add("film-strip-shell--retracting");
      window.setTimeout(() => {
        viewerPanel.classList.remove("film-viewer-panel--visible", "film-viewer-panel--enter");
        window.setTimeout(() => {
          viewerPanel.hidden = true;
          viewerPanel.setAttribute("hidden", "");
          stripShell.classList.remove("film-strip-shell--retracting");
          const rollBtn = returnViewerToHome();
          activeRollId = null;
          if (rollBtn) rollBtn.focus({ preventScroll: true });
        }, 280);
      }, 420);
    }

    rollSwap.addEventListener("change", () => {
      const next = rollSwap.value;
      if (next === activeRollId) return;
      stripShell.classList.add("film-strip-shell--retracting");
      window.setTimeout(() => {
        loadRollInViewer(next);
        stripShell.classList.remove("film-strip-shell--retracting");
        void stripShell.offsetWidth;
        stripEl.classList.add("film-strip--reveal");
        window.setTimeout(() => stripEl.classList.remove("film-strip--reveal"), UNSPOOL_MS + 120);
        requestAnimationFrame(() => {
          syncScrubFromScroll();
        });
      }, RETRACT_MS);
    });

    scrubEl.addEventListener("input", () => {
      syncScrollFromScrub();
      scrubEl.setAttribute("aria-valuetext", `${scrubEl.value}% along the strip`);
    });

    viewerBack.addEventListener("click", closeViewer);

    buildShelf();
    bindStripScroll();

    function applyProjectsHash() {
      const raw = location.hash.replace(/^#/, "");
      if (raw === "film-roll-code" || raw === "creative-coding") {
        openViewer("code");
      }
    }
    applyProjectsHash();
    window.addEventListener("hashchange", applyProjectsHash);

    window.addEventListener("resize", () => {
      if (!viewerPanel.hidden) syncScrubFromScroll();
    });

    const lightbox = document.getElementById("image-lightbox");
    const lightboxImage = document.getElementById("lightbox-image");
    const lightboxVideo = document.getElementById("lightbox-video");
    const lightboxClose = document.getElementById("lightbox-close");
    const lightboxPrev = document.getElementById("lightbox-prev");
    const lightboxNext = document.getElementById("lightbox-next");
    const lightboxMeta = document.getElementById("lightbox-meta");
    const lightboxMetaLabel = document.getElementById("lightbox-meta-label");
    const lightboxMetaBody = document.getElementById("lightbox-meta-body");
    const lightboxMetaLinkWrap = document.getElementById("lightbox-meta-link-wrap");
    const lightboxMetaLink = document.getElementById("lightbox-meta-link");

    stripEl.addEventListener("keydown", (event) => {
      if (!lightbox.hidden) return;
      const step = Math.min(160, stripEl.clientWidth * 0.35);
      if (event.key === "ArrowRight") {
        event.preventDefault();
        stripEl.scrollBy({ left: step, behavior: "smooth" });
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        stripEl.scrollBy({ left: -step, behavior: "smooth" });
      }
    });

    let lightboxIndex = 0;

    function getLightboxGallery() {
      const items = [];
      FILM_ROLLS.forEach((roll) => {
        roll.frames.forEach((frame) => {
          items.push({ rollId: roll.id, frame });
        });
      });
      return items;
    }

    function resolveFrameSrc(src) {
      try {
        return new URL(src, document.baseURI).href;
      } catch {
        return src;
      }
    }

    function findGalleryIndex(image) {
      const gallery = getLightboxGallery();
      const attrSrc = image.getAttribute("src") || "";
      const resolvedSrc = image.src;
      let found = gallery.findIndex((item) => {
        if (activeRollId && item.rollId !== activeRollId) return false;
        return item.frame.src === attrSrc || resolveFrameSrc(item.frame.src) === resolvedSrc;
      });
      if (found < 0) {
        found = gallery.findIndex(
          (item) => item.frame.src === attrSrc || resolveFrameSrc(item.frame.src) === resolvedSrc
        );
      }
      return found;
    }

    function syncViewerToGalleryItem(item) {
      if (!item || viewerPanel.hidden) return;
      if (item.rollId === activeRollId) return;
      loadRollInViewer(item.rollId);
    }

    function syncNavButtons(count) {
      const show = count > 1;
      lightboxPrev.hidden = !show;
      lightboxNext.hidden = !show;
    }

    function showLightboxFrame(frame) {
      if (frame.videoEmbed) {
        lightboxImage.hidden = true;
        lightboxImage.removeAttribute("src");
        lightboxVideo.src = frame.videoEmbed;
        lightboxVideo.hidden = false;
      } else {
        lightboxVideo.hidden = true;
        lightboxVideo.removeAttribute("src");
        lightboxImage.src = frame.src;
        lightboxImage.alt = frame.alt || "Portfolio artwork";
        lightboxImage.hidden = false;
      }
      const cap = frame.caption;
      const desc = frame.description;
      const linkHref = frame.linkHref;
      const linkLabel = frame.linkLabel;
      lightboxMetaLink.href = "#";
      lightboxMetaLink.textContent = "";
      lightboxMetaLinkWrap.hidden = true;

      if (cap || desc || linkHref) {
        lightboxMetaLabel.innerHTML = "";
        if (cap && linkHref) {
          const titleLink = document.createElement("a");
          titleLink.className = "lightbox-meta__title-link";
          titleLink.href = linkHref;
          titleLink.target = "_blank";
          titleLink.rel = "noopener noreferrer";
          titleLink.textContent = cap;
          lightboxMetaLabel.appendChild(titleLink);
          lightboxMetaLabel.hidden = false;
        } else {
          lightboxMetaLabel.textContent = cap || "";
          lightboxMetaLabel.hidden = !cap;
          if (linkHref) {
            lightboxMetaLink.href = linkHref;
            lightboxMetaLink.textContent = linkLabel || linkHref;
            lightboxMetaLinkWrap.hidden = false;
          }
        }
        lightboxMetaBody.textContent = desc || "";
        lightboxMetaBody.hidden = !desc;
        lightboxMeta.hidden = false;
      } else {
        lightboxMetaLabel.textContent = "";
        lightboxMetaBody.textContent = "";
        lightboxMeta.hidden = true;
      }
    }

    function openLightbox(image) {
      const gallery = getLightboxGallery();
      const found = findGalleryIndex(image);
      lightboxIndex = found >= 0 ? found : 0;
      const item = gallery[lightboxIndex];
      showLightboxFrame(item.frame);
      syncViewerToGalleryItem(item);
      syncNavButtons(gallery.length);
      lightbox.hidden = false;
      document.body.style.overflow = "hidden";
    }

    function stepLightbox(delta) {
      const gallery = getLightboxGallery();
      if (gallery.length < 2) return;
      lightboxIndex = (lightboxIndex + delta + gallery.length) % gallery.length;
      const item = gallery[lightboxIndex];
      showLightboxFrame(item.frame);
      syncViewerToGalleryItem(item);
    }

    function closeLightbox() {
      const gallery = getLightboxGallery();
      const item = gallery[lightboxIndex];
      if (item) syncViewerToGalleryItem(item);
      lightbox.hidden = true;
      lightboxImage.removeAttribute("src");
      lightboxVideo.removeAttribute("src");
      lightboxVideo.hidden = true;
      lightboxImage.hidden = false;
      lightboxMeta.hidden = true;
      lightboxMetaLabel.innerHTML = "";
      lightboxMetaBody.textContent = "";
      lightboxMetaLink.href = "#";
      lightboxMetaLink.textContent = "";
      lightboxMetaLinkWrap.hidden = true;
      document.body.style.overflow = "";
    }

    document.addEventListener("pointerdown", (event) => {
      const image = event.target.closest("img[data-lightbox]");
      if (!image) return;
      event.preventDefault();
      openLightbox(image);
    });

    lightboxClose.addEventListener("click", closeLightbox);
    lightboxPrev.addEventListener("click", (event) => {
      event.stopPropagation();
      stepLightbox(-1);
    });
    lightboxNext.addEventListener("click", (event) => {
      event.stopPropagation();
      stepLightbox(1);
    });
    lightbox.addEventListener("pointerdown", (event) => {
      if (event.target.closest(".lightbox-content, .lightbox-close, .lightbox-nav")) return;
      closeLightbox();
    });
    window.addEventListener("keydown", (event) => {
      if (!lightbox.hidden) {
        if (event.key === "Escape") {
          closeLightbox();
          return;
        }
        if (event.key === "ArrowRight") {
          event.preventDefault();
          stepLightbox(1);
          return;
        }
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          stepLightbox(-1);
          return;
        }
      }
      if (event.key === "Escape" && !viewerPanel.hidden) closeViewer();
    });
  </script>
</body>
</html>
